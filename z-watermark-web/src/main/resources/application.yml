# z-watermark 管控面配置
#
# 键名模式：z.base.db.watermark.*（ModuleDataSourceTemplate 的权威前缀常量，缺省回落到 z.base.db.default.*）
# 凭据一律走环境变量注入，**不落明文**（组织 008 凭证规范）。
#
# 库归属：共用单库 `oc`（同 z-trade / z-biz / z-opcs）。库名要改只动这一处 + DDL 脚本。

server:
  port: ${Z_WATERMARK_SERVER_PORT:8096}

z:
  watermark:
    # ★ M2 #22：审计域基址（溯源闭环的落台账 / 反查出口）。
    #   留空 ⇒ 本域不挂溯源出口 ⇒ 打水印照常，但没有溯源台账
    #   （响应里 traceRecorded=false 会明确标出这个缺口）。
    #
    # ⚠️ **z-audit 是 z_audit_event 表的唯一权威写者**（哈希链要求单写者）——
    #    本域**不自己写那张表**，一律交给 z-audit 写。
    audit-base-url: ${Z_WATERMARK_AUDIT_BASE_URL:http://127.0.0.1:8097}
  base:
    db:
      watermark:
        host: ${Z_WATERMARK_DB_HOST:127.0.0.1}
        port: ${Z_WATERMARK_DB_PORT:3306}
        database: ${Z_WATERMARK_DB_NAME:oc}
        username: ${Z_WATERMARK_DB_USERNAME:}
        password: ${Z_WATERMARK_DB_PASSWORD:}
        initial-size: 2
        min-idle: 2
        max-active: 10
        # 开发 / 测试直连模式：显式给 JDBC URL 时不套上面的键名模式。
        # 本仓验收项（DDL 幂等、接口可路由）就跑在本地 H2 上，**不连生产 RDS**。
        # url: jdbc:h2:mem:watermark;MODE=MySQL;DB_CLOSE_DELAY=-1
        # driver-class-name: org.h2.Driver
        # username: sa
        # password:

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.zifang.z.watermark: INFO
